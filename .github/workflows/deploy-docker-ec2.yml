name: Deploy Docker to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-docker-ec2
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/blessing-tree
  EC2_PORT: ${{ vars.EC2_PORT || '22' }}
  EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/opt/blessing-tree' }}
  BT_HTTP_PORT: ${{ vars.BT_HTTP_PORT || '80' }}
  BT_HTTPS_PORT: ${{ vars.BT_HTTPS_PORT || '443' }}

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    environment: production

    outputs:
      api-image: ${{ steps.images.outputs.api }}
      ui-image: ${{ steps.images.outputs.ui }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: blessing-tree-api
          file: blessing-tree-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: blessing-tree-ui/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ui:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-ui:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail
          echo "api=${IMAGE_PREFIX}-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ui=${IMAGE_PREFIX}-ui:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy on EC2
    needs: build
    runs-on: [self-hosted, prod-blessing-tree]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage compose files
        run: |
          set -euo pipefail
          sudo mkdir -p "$EC2_DEPLOY_PATH/compose/deploy/docker/caddy"
          sudo cp docker-compose.yml docker-compose.prod.yml "$EC2_DEPLOY_PATH/compose/"
          sudo cp deploy/docker/caddy/Caddyfile "$EC2_DEPLOY_PATH/compose/deploy/docker/caddy/Caddyfile"
          sudo chown -R "$(id -u):$(id -g)" "$EC2_DEPLOY_PATH/compose"
          mkdir -p /tmp/blessing-tree-deploy
          cp scripts/deploy/ec2_docker_deploy.sh /tmp/blessing-tree-deploy/ec2_docker_deploy.sh
          chmod +x /tmp/blessing-tree-deploy/ec2_docker_deploy.sh

      - name: Deploy
        run: |
          set -euo pipefail
          BT_APP_DIR="$EC2_DEPLOY_PATH" \
          BT_RELEASE_ID="${{ github.sha }}" \
          BT_API_IMAGE="${{ needs.build.outputs.api-image }}" \
          BT_UI_IMAGE="${{ needs.build.outputs.ui-image }}" \
          BT_HTTP_PORT="$BT_HTTP_PORT" \
          BT_HTTPS_PORT="$BT_HTTPS_PORT" \
          GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}" \
          GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}" \
          /tmp/blessing-tree-deploy/ec2_docker_deploy.sh
